<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Semantic Search</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-lg">
            <a class="navbar-brand" href="#">🎵 Audio Search</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
        </div>
    </nav>

    <div class="container-lg my-5">
        <ul class="nav nav-tabs mb-4" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link tab active" id="search-tab" data-bs-toggle="tab" data-bs-target="#search" type="button" data-tab="search" role="tab" aria-controls="search" aria-selected="true">
                    Global Search
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link tab" id="user-tab" data-bs-toggle="tab" data-bs-target="#user" type="button" data-tab="user" role="tab" aria-controls="user" aria-selected="false">
                    User Index & Search
                </button>
            </li>
        </ul>

        <div class="tab-content">
            <!-- Global Search Panel -->
            <div class="tab-pane fade show active" id="search" role="tabpanel" aria-labelledby="search-tab">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h5 class="card-title mb-0">🔍 Global Search</h5>
                    </div>
                    <div class="card-body">
                        <div class="row mb-4">
                            <div class="col-md-8">
                                <label for="textQuery" class="form-label">Text Query</label>
                                <input type="text" class="form-control" id="textQuery" placeholder="Describe the sound you're looking for...">
                            </div>
                            <div class="col-md-4 d-flex align-items-end">
                                <button id="textSearchBtn" class="btn btn-primary w-100">Search</button>
                            </div>
                        </div>

                        <hr>

                        <div class="row mb-4">
                            <div class="col-md-8">
                                <label for="audioQueryFile" class="form-label">Audio Query</label>
                                <input type="file" class="form-control" id="audioQueryFile" accept="audio/*">
                            </div>
                            <div class="col-md-4 d-flex align-items-end">
                                <button id="audioSearchBtn" class="btn btn-secondary w-100">Search by Audio</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="mt-4">
                    <div id="searchResults" class="scrollable-files-container"></div>
                </div>
            </div>

            <!-- User Index & Search Panel -->
            <div class="tab-pane fade" id="user" role="tabpanel" aria-labelledby="user-tab">
                <div class="row g-4">
                    <!-- Upload Section -->
                    <div class="col-lg-6">
                        <div class="card h-100">
                            <div class="card-header bg-success text-white">
                                <h5 class="card-title mb-0">📤 Upload & Index</h5>
                            </div>
                            <div class="card-body">
                                <div class="mb-3">
                                    <label for="uploadFiles" class="form-label">Audio Files</label>
                                    <input type="file" class="form-control" id="uploadFiles" multiple accept="audio/*">
                                    <small class="text-muted">Select one or more audio files to index</small>
                                </div>

                                <input type="hidden" id="sessionId">

                                <button id="uploadBtn" class="btn btn-success w-100">Upload & Index</button>
                                <button id="showFilesBtn" class="btn btn-info w-100 mt-2">Show Indexed Files</button>
                                <div id="uploadProgress" class="mt-3"></div>
                                <div id="userFilesList" class="scrollable-files-container mt-3"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Search Section -->
                    <div class="col-lg-6">
                        <div class="card">
                            <div class="card-header bg-info text-white">
                                <h5 class="card-title mb-0">🔎 Search User Index</h5>
                            </div>
                            <div class="card-body">
                                <div class="mb-3">
                                    <label for="userTextQuery" class="form-label">Text Query</label>
                                    <input type="text" class="form-control" id="userTextQuery" placeholder="Search indexed audio...">
                                </div>

                                <button id="userTextSearchBtn" class="btn btn-info w-100 mb-3">Search User Index</button>

                                <hr>

                                <div class="mb-3">
                                    <label for="userAudioQueryFile" class="form-label">Audio Query</label>
                                    <input type="file" class="form-control" id="userAudioQueryFile" accept="audio/*">
                                </div>

                                <button id="userAudioSearchBtn" class="btn btn-info w-100 mb-3">Search by Audio</button>

                                <hr>

                                <button id="clearUserBtn" class="btn btn-danger w-100">Clear User Index</button>
                            </div>
                        </div>
                        <div class="mt-4">
                            <div id="userResults" class="scrollable-files-container"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white text-center py-4 mt-5">
        <p class="mb-0">&copy; 2026 Audio Semantic Search. All rights reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/app.js"></script>
</body>
</html>
